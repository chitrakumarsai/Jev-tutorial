<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jev Audit Lens: typed, calibrated AI decisions vs. a plain LLM on audit tasks."
    />
    <title>Jev Audit Lens</title>
    <script>
      // Pins a saved light/dark theme before first paint (see useTheme.ts). Needs a CSP hash.
      try {
        var t = localStorage.getItem('jev-audit-lens:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
